<style>
:root{
  --bg:#0F1115; --card:#171A20; --card2:#1D212A; --border:#262B34;
  --text:#F3F4F6; --text2:#98A0AC; --text3:#656D79;
  --harrisx:#FF7A59; --edo:#3FC9E0; --gold:#E8B84F; --green:#4CAF6D; --red:#E0524A;
  --radius:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg); color:var(--text); font-family:'Manrope',sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
.container{max-width:1160px; margin:0 auto; padding:0 24px;}
a{color:inherit;}
h1,h2,h3{font-family:'Sora',sans-serif; font-weight:700; letter-spacing:-0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}

nav{position:sticky; top:0; z-index:100; background:rgba(15,17,21,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--border);}
nav .container{display:flex; align-items:center; justify-content:space-between; height:60px;}
.logo{display:flex; align-items:center; gap:8px; font-family:'Sora'; font-weight:700; font-size:16px;}
.logo .dots{display:flex; gap:3px;}
.logo .dot{width:9px; height:9px; border-radius:50%;}
.navlinks{list-style:none; display:flex; align-items:center; gap:22px;}
nav a.navlink{font-size:12.5px; color:var(--text2); transition:color .15s;}
nav a.navlink:hover{color:var(--text);}
@media(max-width:820px){.navlinks li:not(.lang-item){display:none;}}
.lang-switch{display:flex; gap:6px;}
.lang-switch a{font-size:11px; font-weight:600; padding:4px 9px; border:1px solid var(--border); border-radius:20px; color:var(--text2);}
.lang-switch a.active{color:var(--bg); background:var(--gold); border-color:var(--gold);}

.hero{padding:60px 0 20px;}
.eyebrow{font-family:'JetBrains Mono'; font-size:12px; font-weight:600; letter-spacing:0.1em; color:var(--gold); margin-bottom:14px; text-transform:uppercase;}
.hero h1{font-size:clamp(34px,5.6vw,58px); line-height:1.03; margin-bottom:18px;}
.hero h1 .hx{color:var(--harrisx);} .hero h1 .ed{color:var(--edo);}
.hero p{font-size:17px; color:var(--text2); max-width:640px; margin-bottom:8px;}
.hero .snapshot{font-family:'JetBrains Mono'; font-size:11.5px; color:var(--text3); margin-top:14px;}

.legend-dual{display:flex; gap:22px; margin-top:26px; flex-wrap:wrap;}
.legend-dual .item{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text2);}
.legend-dual .sw{width:14px; height:14px; border-radius:4px;}

.kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:26px;}
@media(max-width:760px){.kpi-row{grid-template-columns:1fr 1fr;}}
.kpi{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
.kpi .val{font-family:'Sora'; font-size:28px; font-weight:800;}
.kpi .lbl{font-size:11.5px; color:var(--text2); margin-top:4px;}

section{padding:70px 0;}
section.alt{background:var(--card2); border-top:1px solid var(--border); border-bottom:1px solid var(--border);}
.section-head{max-width:660px; margin-bottom:34px;}
.section-head .eyebrow{margin-bottom:8px;}
.section-head h2{font-size:clamp(24px,3.2vw,34px); margin-bottom:10px;}
.section-head p{color:var(--text2); font-size:15px;}

.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.grid-3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:18px;}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; min-width:0;}
.card h3{font-family:'Manrope'; font-weight:700; font-size:15.5px; margin-bottom:2px;}
.card .sub{font-size:12px; color:var(--text2); margin-bottom:16px;}
.card canvas{max-height:280px; max-width:100%;}
.chart-error{font-size:12px; color:var(--text3); padding:30px 0; text-align:center;}

/* HERO RANKING (barra grande, signature) */
.ranking-wrap{margin-top:36px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:24px;}

/* DUAL COMPARISON (signature secundario) */
.dual-card{background:var(--card2); border:1px solid var(--border); border-radius:var(--radius); padding:26px;}
.dual-row{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:18px;}
@media(max-width:700px){.dual-row{grid-template-columns:1fr;}}
.dual-item{background:var(--card); border-radius:12px; padding:16px 18px;}
.dual-item .brand{font-weight:700; font-size:15px; margin-bottom:8px;}
.dual-item .metric-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.dual-item .metric-row .lbl{font-size:11.5px; color:var(--text2);}
.dual-item .metric-row .v{font-family:'JetBrains Mono'; font-weight:700; font-size:17px;}
.dual-item .bar-track{height:6px; background:var(--bg); border-radius:3px; overflow:hidden; margin-bottom:12px;}
.dual-item .bar-fill{height:100%; border-radius:3px;}

/* CALLOUT (hallazgo destacado) */
.callout{background:linear-gradient(135deg, rgba(255,122,89,0.12), rgba(63,201,224,0.12)); border:1px solid var(--border); border-radius:var(--radius); padding:28px;}
.callout .big{font-family:'Sora'; font-size:clamp(28px,4vw,42px); font-weight:800; margin:10px 0;}
.callout .big .hx{color:var(--harrisx);} .callout .big .ed{color:var(--edo);}

.stack-badges{display:flex; flex-wrap:wrap; gap:10px;}
.badge{padding:8px 16px; background:var(--card); border:1px solid var(--border); border-radius:20px; font-size:13px; color:var(--text2);}

footer{padding:48px 0; text-align:center; border-top:1px solid var(--border);}
footer p{font-size:12px; color:var(--text3); max-width:640px; margin:0 auto; line-height:1.6;}
</style>

const T = I18N[LANG] || I18N.es;

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(T[key] !== undefined) el.textContent = T[key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{
    const key = el.getAttribute('data-i18n-html');
    if(T[key] !== undefined) el.innerHTML = T[key];
  });
}
applyI18n();

let EDA={}, NLP={};
try{
  EDA = JSON.parse(document.getElementById('data-eda').textContent);
  NLP = JSON.parse(document.getElementById('data-nlp').textContent);
}catch(e){ console.error('Error parsing embedded data', e); }

const HX = '#FF7A59', ED = '#3FC9E0', GOLD = '#E8B84F', GREEN='#4CAF6D', RED='#E0524A';
const TXT2 = '#98A0AC';
const GRID = 'rgba(255,255,255,0.06)';

if(typeof Chart !== 'undefined'){
  Chart.defaults.color = TXT2;
  Chart.defaults.font.family = "'Manrope', sans-serif";
  Chart.defaults.font.size = 12;
}

function safeChart(canvasId, config){
  try{
    if(typeof Chart === 'undefined') throw new Error('Chart.js unavailable');
    const el = document.getElementById(canvasId);
    if(!el) return null;
    return new Chart(el, config);
  }catch(err){
    console.error('Chart error ['+canvasId+']', err);
    const el = document.getElementById(canvasId);
    if(el && el.parentNode){
      const msg = document.createElement('div');
      msg.className = 'chart-error';
      msg.textContent = T.chart_error;
      el.parentNode.replaceChild(msg, el);
    }
    return null;
  }
}

// ---------- HERO: RANKING COMPLETO ----------
safeChart('chart-ranking', {
  type:'bar',
  data:{
    labels:(EDA.ranking_completo||[]).map(d=>`${d.marca} — ${d.nombre_anuncio}`),
    datasets:[{
      data:(EDA.ranking_completo||[]).map(d=>d.harrisx_score),
      backgroundColor:(EDA.ranking_completo||[]).map(d=>d.harrisx_score>=83?HX:'rgba(255,122,89,0.35)'),
      borderRadius:5,
    }]
  },
  options:{
    responsive:true, indexAxis:'y',
    plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.raw+'/100'}}},
    scales:{x:{grid:{color:GRID}, min:0, max:100, title:{display:true,text:T.axis_score,color:TXT2}}, y:{grid:{display:false}, ticks:{font:{size:10.5}}}}

// ---------- DUAL: HarrisX vs EDO scatter + cards ----------
(function(){
  const data = EDA.harrisx_vs_edo || [];
  safeChart('chart-dual', {
    type:'bar',
    data:{
      labels: data.map(d=>`${d.marca}`),
      datasets:[
        {label:T.legend_hx_short, data: data.map(d=>d.harrisx_score), backgroundColor:HX, borderRadius:5},
        {label:T.legend_ed_short, data: data.map(d=>d.edo_index), backgroundColor:ED, borderRadius:5},
      ]
    },
    options:{
      responsive:true,
      plugins:{legend:{display:true, position:'bottom', labels:{boxWidth:10, padding:14}}},
      scales:{x:{grid:{display:false}}, y:{grid:{color:GRID}}}
    }
  });
  const wrap = document.getElementById('dual-cards');
  data.forEach(d=>{
    const div = document.createElement('div');
    div.className = 'dual-item';
    const hxPct = (d.harrisx_score/93.2*100).toFixed(0);
    const edPct = Math.min(100, d.edo_index/10*100/10*10);
    div.innerHTML = `
      <div class="brand">${d.marca} — ${d.nombre_anuncio}</div>
      <div class="metric-row"><span class="lbl">HarrisX</span><span class="v" style="color:${HX}">#${d.harrisx_rank} (${d.harrisx_score})</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${hxPct}%; background:${HX}"></div></div>
      <div class="metric-row"><span class="lbl">EDO</span><span class="v" style="color:${ED}">${d.edo_index.toFixed(0)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,d.edo_index/9.1)}%; background:${ED}"></div></div>
    `;
    wrap.appendChild(div);
  });
})();

// ---------- ATRIBUTOS ----------
(function(){
  const rows = EDA.atributos_vs_score || [];
  const pairs = [];
  for(let i=0;i<rows.length;i+=2){ pairs.push([rows[i], rows[i+1]]); }
  const labels = pairs.map(p=>p[0].atributo.replace('Con ',''));
  const conVals = pairs.map(p=>p[0].score_promedio);
  const sinVals = pairs.map(p=>p[1].score_promedio);
  safeChart('chart-atributos', {
    type:'bar',
    data:{labels, datasets:[
      {label:'Con atributo', data:conVals, backgroundColor:HX, borderRadius:4},
      {label:'Sin atributo', data:sinVals, backgroundColor:'rgba(255,255,255,0.18)', borderRadius:4},
    ]},
    options:{responsive:true, plugins:{legend:{display:true,position:'bottom',labels:{boxWidth:10,padding:12}}}, scales:{y:{grid:{color:GRID},min:0,max:100}, x:{grid:{display:false}}}}
  });
})();
